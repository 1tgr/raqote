[package]
authors = ["Jeff Muizelaar <jrmuizel@gmail.com>"]
edition = "2018"
name = "raqote"
version = "0.8.5"
description = "2D graphics library"
license = "BSD-3-Clause"
repository = "https://github.com/jrmuizel/raqote"
documentation = "https://docs.rs/raqote"
readme = "README.md"
keywords = ["2d", "graphics"]
categories = ["graphics"]

[dependencies]
euclid = { version = "0.22", default-features = false, features = ["libm"] }
font-kit = { version = "0.14", optional = true }
lyon_geom = { version = "1.0", default-features = false }
num-traits = { version = "0.2.10", default-features = false, features = ["libm"] }
pathfinder_geometry = { version = "0.5", optional = true }
png = { version = "0.17", optional = true }
sw-composite = { version = "0.7.15", git = "https://github.com/1tgr/sw-composite.git", branch = "no-std", default-features = false }
typed-arena = { version = "2.0", default-features = false }

[features]
default = ["std", "text"]
std = ["png", "euclid/std", "lyon_geom/std", "num-traits/std", "sw-composite/std"]
text = ["font-kit", "pathfinder_geometry"]
